      additionalProperties: false
      properties:
        task_id:
          type: string
        status:
          type: string
        result:
          type: object
          description: Un dia por clave (`day_0`, `day_1`, ...) con sus items.
          additionalProperties: false
          patternProperties:
            "^day_[0-9]+$":
              type: array
              items:
                $ref: "#/components/schemas/PlanItem"
    ChatAction:
      type: object
      description: Accion del agente. Solo salen las acciones listadas en `name`; el resto se descarta.
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
            - speak
            - text
            - redirect
            - raw_data
            - gesture
            - changeRebecaDress
        parameters:
          type: object
          description: >-
            Segun `name`: `speak` {text, language_code}; `text` {text}; `redirect` {destiny};
            `gesture` {gestures}; `changeRebecaDress` {destination_id}; `raw_data` {data}, donde
            `data` (objeto o lista) es la union de los campos de `ChatRawData`.
          additionalProperties: false
          properties:
            text:
              type: string
            language_code:
              type: string
            destiny:
              type: string
            gestures:
              type: array
              items:
                type: string
            destination_id:
              type: integer
            data:
              oneOf:
                - $ref: "#/components/schemas/ChatRawData"
                - type: array
                  items:
                    $ref: "#/components/schemas/ChatRawData"
    ChatRawData:
      type: object
      description: Contenido de una accion `raw_data` (fichas de destino, plan asincrono, POI, alojamiento, itinerario).
      additionalProperties: false
      properties:
        title:
          type: string
        text:
          type: string
        description:
          type: string
        image:
          type: string
        images:
          type: array
          items:
            type: string
        thumb_ref:
          type: string
        thumb_refs:
          type: array
          items:
            type: string
        video_ref:
          type: string
        video_refs:
          type: array
          items:
            type: string
        videos:
          type: array
          items:
            type: string
        task_id:
          type: string
          description: Id para consultar `GET /plan-status/{task_id}`.
        status:
          type: string
        destination_id:
          type: integer
        categories:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        pois:
          type: array
          items:
            $ref: "#/components/schemas/Poi"
        accommodation_name:
          type: string
        accommodation_code:
          type: string
        accommodation_description:
          type: string
        accommodation_spaces:
          type: number
        accommodation_items:
          type: array
          items:
            type: string
        price:
          type: number
        availability:
          type: boolean
        latitude:
          type: number
        longitude:
          type: number
        trip:
          $ref: "#/components/schemas/TripSummary"
        trip_activities:
          type: array
          items:
            $ref: "#/components/schemas/TripDay"
        plan:
          type: object
          additionalProperties: false
          properties:
            trip:
              $ref: "#/components/schemas/TripSummary"
            trip_activities:
              type: array
              items:
                $ref: "#/components/schemas/TripDay"
    ChatData:
      type: object
      description: Respuesta del agente. Solo salen los campos listados.
      additionalProperties: false
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ChatAction"
        thread_id:
          type: string
          description: Identificador del hilo de la conversacion.
  responses:
    BadRequest:
      description: Validacion fallida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            errors:
              - type: address
                msg: address is required
    Unauthorized:
      description: Sin key, key invalida o revocada, o token invalido, ajeno o de otro tipo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            errors:
              - type: token
                msg: Unauthorized Access - No Token Provided!
    Forbidden:
      description: Origin no permitido para esta key publicable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            errors:
              - type: origin
                msg: Origin not allowed
    NotFound:
      description: Recurso no encontrado (un viaje o task_id ajeno o inexistente responde igual)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            errors:
              - type: task_id
                msg: task not found
    Conflict:
      description: El negocio no tiene agente asignado (solo /chat)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            errors:
              - type: agent
                msg: No agent is bound to this client
    ServerError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            errors:
              - type: generic
                msg: An error occurred! Try again later
    TooManyRequests:
      description: Cuota diaria superada (5000/dia por negocio para claves publicables sin cuota propia)
      headers:
        Retry-After:
          description: Segundos hasta que se reinicia la cuota (medianoche UTC).
          schema:
            type: integer
            example: 3600
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            errors:
              - type: quota
                msg: Daily quota exceeded
