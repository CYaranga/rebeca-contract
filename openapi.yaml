      - $ref: '#/components/schemas/ApiToken'
      - type: object
        required:
        - token
        properties:
          token:
            type: string
            description: Plaintext rl_live_<32> (spec:203); se muestra una sola vez, solo el hash se
              guarda.
      description: Respuesta de POST /logs/auth/tokens.
