components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT de sesion admin (12h), o token de API `rl_live_<32>` (type=user, con Logs
        access) en las rutas de lectura bajo /logs (errors/bugs/replay/behaviour/stats/tokens,
        spec:251). POST/GET/DELETE /logs/auth/tokens solo aceptan el JWT del usuario autenticado, no
        un token rl_live_ (spec:265).'
    loggerKeyAuth:
      type: apiKey
      in: header
      name: X-Logger-Key
      description: 'Token de emisor (api_tokens tipo `emitter`, decisions.md Q11-bis:1), gestionado por
        POST/GET/DELETE /logs/auth/tokens. Sustituye las env vars LOGGER_KEY_*. Valida `source` en cada
        POST /logs/batch y POST /logs/bugs; sin rate limit por IP (Q11-bis).'
  parameters:
    XSessionIdHeader:
      name: X-Session-Id
      in: header
      required: false
      description: 'Header de correlacion recomendado en toda peticion al backend (spec:228); el
        backend lo cuelga en req.ctx y lo usa para etiquetar su propia fila de log con la sesion del
        cliente (Glosario spec:40).'
      schema:
        type: string
    XTraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      description: 'Header de correlacion recomendado en toda peticion al backend (spec:228); el
        backend lo cuelga en req.ctx y lo usa para etiquetar su propia fila de log con la traza del
        cliente (Glosario spec:41).'
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    GenericResult:
      type: object
      additionalProperties: true
      description: Forma generica de respuesta 200 no documentada explicitamente por el handler.
    DataEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: true
      description: 'Envoltorio {data: ...} usado por la mayoria de rutas POST/PUT/DELETE de este backend
        (verificado via grep req.body.data en los handlers).'
    GoogleMapsResult:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          enum:
          - success
        data:
          type: object
          additionalProperties: true
          description: JSON de Google (Places Autocomplete/Details o Geocoding) tal cual, sin transformar.
      description: 'Envoltorio {status, data} real de src/Repository/maps/API.js (Helpers/status.js
        successMessage): el handler mete la respuesta cruda de Google en `data` sin transformarla, pero
        NO es passthrough puro a nivel raiz.'
    PlanStatusResult:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          additionalProperties: true
          description: 'Passthrough crudo del cuerpo que devuelve el upstream de recsys (`{task_id,
            status, result}`), sin remapear.'
      description: 'Respuesta de GET /widget/plan-status/{task_id} (planStatusForWidget,
        Repository/widget/API.js:244-245): envuelve el cuerpo de recsys en el
        sobre estándar {status,data}.'
    RecsysPlanStatus:
      type: object
      properties:
        task_id:
          type: string
        status:
          type: string
        result:
          type: [object, 'null']
          additionalProperties: true
      description: Respuesta de GET /recsys/plan-status/{task_id} (getPlanStatus, Repository/recsys/API.js:41).
        Passthrough crudo del cuerpo del upstream de recsys, sin envoltorio.
    Provider:
      type: object
      description: Fila de `provider` tal como la devuelve getFilteredProviders (Repository/provider/DAL.js:43).
      properties:
        prov_id:
          type: integer
        provider_status:
          type: string
        address:
          type: [string, 'null']
        company_name:
          type: string
        location:
          type: [string, 'null']
        type:
          type: string
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ProviderChannel'
        description:
          type: [string, 'null']
    ProviderChannel:
      type: string
      enum:
      - widget
      - whatsapp
      - kommo
      description: Repository/providerChannels/index.js:16 (CHANNELS).
    ProviderChannelsView:
      type: object
      description: Forma devuelta por toChannelsView (Repository/providerChannels/index.js:81); los secretos son write-only, solo viajan como has_*.
      properties:
        whatsapp:
          type: object
          properties:
            phone_number_id:
              type: [string, 'null']
            verify_token:
              type: [string, 'null']
            business_account_id:
              type: [string, 'null']
            has_token:
              type: boolean
            has_app_secret:
              type: boolean
        kommo:
          type: object
          properties:
            subdomain:
              type: [string, 'null']
            client_id:
              type: [string, 'null']
            has_client_secret:
              type: boolean
            connected:
              type: boolean
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ProviderChannel'
    LogEnvironment:
      type: string
      enum:
      - dev
      - test
      - prod
      description: 'Glosario spec:39. `test` es etiqueta de cliente (front-admin la manda cuando la API
        lleva /test/) y cae en la base de dev; no es un schema de Postgres propio.'
    LogSource:
      type: string
      enum:
      - app-ios
      - app-android
      - front-admin
      - widget
      - totem
      - backend
      description: 'Glosario spec:37. Quien escribio la fila. El backend valida que coincida con el
        `source` ligado al token de emisor (X-Logger-Key) usado en la ingesta.'
    LogChannel:
      type: string
      enum:
      - app
      - whatsapp
      - kommo
      - widget
      - octorate
      - totem
      description: 'Glosario spec:38. Canal de negocio de la conversacion; distinto de `source` (una
        fila puede tener source=backend y channel=whatsapp).'
    LogLevel:
      type: string
      enum:
      - debug
      - info
      - warn
      - error
      description: 'Modelo de datos spec:140. `fingerprint` solo se calcula para level=error.'
    LogEntry:
      type: object
      required:
      - source
      - environment
      - level
      - message
      - timestamp
      - session_id
      - trace_id
      properties:
        source:
          $ref: '#/components/schemas/LogSource'
        environment:
          $ref: '#/components/schemas/LogEnvironment'
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
          maxLength: 4096
        timestamp:
          type: string
          format: date-time
        session_id:
          type: string
          description: Mismo valor que el header X-Session-Id de la peticion que origino la fila.
        trace_id:
          type: string
          description: Mismo valor que el header X-Trace-Id de la peticion que origino la fila.
        user_id:
          type: [string, 'null']
        device_id:
          type: [string, 'null']
        channel:
          type: [string, 'null']
          enum:
          - app
          - whatsapp
          - kommo
          - widget
          - octorate
          - totem
          - null
        category:
          type: [string, 'null']
          maxLength: 4096
        metadata:
          type: [object, 'null']
          additionalProperties: true
        http_method:
          type: [string, 'null']
        endpoint:
          type: [string, 'null']
        status_code:
          type: [integer, 'null']
        duration_ms:
          type: [integer, 'null']
        request_data:
          type: [object, 'null']
          additionalProperties: true
          description: Redactado por redactPii antes de insertar (JWT, bearer, api keys, emails,
            tarjetas, hashes); cap 4096 caracteres por campo libre.
        response_data:
          type: [object, 'null']
          additionalProperties: true
          description: Mismo redactado y cap que request_data.
        request_id:
          type: [string, 'null']
          description: Header X-Request-Id devuelto por el backend, para enlazar con Azure.
        app_version:
          type: [string, 'null']
        os_version:
          type: [string, 'null']
        device_model:
          type: [string, 'null']
        network_type:
          type: [string, 'null']
        breadcrumbs:
          type: [array, 'null']
          items:
            type: object
            additionalProperties: true
          description: Solo se procesan en warn/error, como hoy en el worker.
      description: 'spec:214-226. `source` se valida contra el token del emisor; una entry con source
        distinto se descarta (Q11-bis:2).'
    LogBatchRequest:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/LogEntry'
      description: 'Body de POST /logs/batch. Maximo 50 entries y 256 KB por body (spec:216).'
    LogBatchResult:
      type: object
      required:
      - accepted
      - rejected
      properties:
        accepted:
          type: integer
          description: Entries insertadas.
        rejected:
          type: integer
          description: Entries descartadas por source distinto al del token o por campo invalido.
      description: 'Sin 429 (Q11-bis): el lote nunca se rechaza completo por limite de tasa, solo por
        forma (400) o token invalido (401).'
    LogRow:
      type: object
      description: 'Fila de `logs` (rebeca_logs), modelo de datos spec:134-162.'
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        environment:
