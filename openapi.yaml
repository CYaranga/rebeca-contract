    ApiTokenType:
      type: string
      enum:
      - user
      - emitter
      description: 'decisions.md Q11-bis:1. `user`: token de una persona con Logs access, para agentes y
        scripts (spec:201-209/D16). `emitter`: token de un emisor (app/admin/widget), ligado a `source`,
        sustituye a las env vars LOGGER_KEY_*.'
    ApiToken:
      type: object
      description: 'Fila de `api_tokens` (spec:201-209) sin el hash; nunca se devuelve el plaintext tras
        la creacion.'
      properties:
        id:
          type: integer
          format: int64
        prefix:
          type: string
          description: Primeros caracteres del token en plaintext (rl_live_...), para identificarlo en
            la lista sin exponerlo entero.
        name:
          type: string
        type:
          $ref: '#/components/schemas/ApiTokenType'
        source:
          type: [string, 'null']
          enum:
          - app-ios
          - app-android
          - front-admin
          - widget
          - totem
          - backend
          - null
          description: Solo presente si type=emitter; el source con el que se valida cada LogEntry
            ingerida con este token.
        user_id:
          type: [integer, 'null']
          description: users.user_id de la base principal; null en tokens type=emitter.
        expires_at:
          type: [string, 'null']
          format: date-time
        last_used:
          type: [string, 'null']
          format: date-time
    ApiTokenCreateRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ApiTokenType'
        source:
          type: [string, 'null']
          enum:
          - app-ios
          - app-android
          - front-admin
          - widget
          - totem
          - backend
          - null
          description: Obligatorio si type=emitter; ignorado si type=user.
        expires_at:
          type: [string, 'null']
          format: date-time
      description: 'POST /logs/auth/tokens (spec:265), auth JWT del usuario autenticado.'
    ApiTokenCreated:
