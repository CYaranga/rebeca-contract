        category:
          type: [string, 'null']
        message:
          type: string
        metadata:
          type: [object, 'null']
          additionalProperties: true
        user_id:
          type: [string, 'null']
        provider_id:
          type: [integer, 'null']
        device_id:
          type: [string, 'null']
        session_id:
          type: [string, 'null']
        trace_id:
          type: [string, 'null']
        request_id:
          type: [string, 'null']
        http_method:
          type: [string, 'null']
        endpoint:
          type: [string, 'null']
        status_code:
          type: [integer, 'null']
        duration_ms:
          type: [integer, 'null']
        request_data:
          type: [object, 'null']
          additionalProperties: true
        response_data:
          type: [object, 'null']
          additionalProperties: true
        app_version:
          type: [string, 'null']
        os_version:
          type: [string, 'null']
        device_model:
          type: [string, 'null']
        network_type:
          type: [string, 'null']
        fingerprint:
          type: [string, 'null']
        breadcrumbs:
          type: [array, 'null']
          items:
            type: object
            additionalProperties: true
    LogsPage:
      type: object
