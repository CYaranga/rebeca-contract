openapi: 3.1.0
info:
  title: Rebeca API
  version: 1.0.0
  description: 'Generado a partir de src/Router/HTTPRouter.js (rebeca-backend) y la coleccion Bruno ''Rebeca
    - API Endpoints Bruno''. Ver x-source en cada operacion para la linea exacta del router. Las rutas
    de logs/errors/bugs/replay/behaviour/trace/users/stats/tokens son contrato adelantado por el
    architect: su x-source apunta a la spec del vault, aun sin implementar en rebeca-backend. Headers
    de correlacion X-Session-Id/X-Trace-Id (components.parameters XSessionIdHeader/XTraceIdHeader):
    convencion recomendada en toda peticion al backend para que el backend etiquete su propia fila de
    log con sesion/traza; documentados explicitamente solo en las rutas de ingesta de logs/bugs.'
